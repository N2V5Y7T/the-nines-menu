<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>The Nines</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      background: #0a0a0a;
      -webkit-text-size-adjust: 100%;
    }

    body {
      background: #0a0a0a;
      color: #fff;
      font-family: 'Inter', system-ui, sans-serif;
      margin: 0;
      /* Remove overflow-x: hidden and min-height constraints to ensure vertical scroll works */
    }

    /* ── Fixed canvas viewport ── */
    #canvas-viewport {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh; /* fallback */
      height: 100dvh;
      z-index: 0;
      overflow: hidden;
    }

    #main-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ── Scroll container (drives all animations) ── */
    #scroll-container {
      position: relative;
      z-index: 1;
      pointer-events: none;
      /* Height set by JS. Canvas is fixed, so no margin overlap needed. */
    }

    /* ── Desktop: centered vertical frame with dark side bars ── */
    @media (min-aspect-ratio: 9/16) {
      #canvas-viewport {
        left: 50%;
        transform: translateX(-50%);
        width: calc(100vh * 9 / 16);
        width: calc(100dvh * 9 / 16);
      }
    }

    /* ── Menu Overlay ── */
    #menu-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      z-index: 10;
      pointer-events: none;
    }
    
    .menu-section {
      position: absolute;
      top: 15vh; /* Menu starts scrolling from here */
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 414px; /* Mobile safe width */
      padding: 0 24px 10vh;
      pointer-events: auto; /* Let clicks pass to items if needed */
      text-shadow: 0 2px 16px rgba(0,0,0,0.4), 0 1px 3px rgba(0,0,0,0.8);
      will-change: transform, opacity;
    }

    .menu-section.group-intro {
      top: 50%;
      padding: 0 24px;
      /* center group intros precisely, they don't scroll */
      transform: translate(-50%, calc(-50% + var(--intro-y, 0px)));
    }

    /* Emergence animation logic */
    /* Starting down at 15vh (gentle rise) instead of 35vh prevents it from moving too fast */
    .group-title, .sec-header {
      opacity: var(--cat-prog, 1);
      transform: translateY(calc((1 - var(--cat-prog, 1)) * 12vh));
      text-align: center;
      margin-bottom: 24px;
    }
    .menu-content {
      opacity: var(--menu-prog, 1);
      /* Menu rises smoothly from just below */
      transform: translateY(calc((1 - var(--menu-prog, 1)) * 8vh));
    }

    /* Typography */
    .group-title {
      font-family: 'Playfair Display', serif;
      font-size: 48px;
      font-weight: 400; /* Lighter is more premium */
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #fff;
    }

    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #f8f8f8;
      margin-bottom: 4px;
    }

    .section-note {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 300;
      color: #ddd;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-style: normal;
    }

    .subgroup {
      margin-top: 36px;
    }
    .subgroup-title {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 400;
      color: #c17b55;
      margin-bottom: 8px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .subgroup-note {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 300;
      color: #bbb;
      margin-bottom: 18px;
    }

    .items-grid {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .menu-item {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
    }

    .item-name {
      flex: 1;
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 400;
      line-height: 1.4;
      letter-spacing: 0.02em;
    }

    .item-price {
      font-size: 16px;
      font-weight: 500;
      color: #c17b55;
      text-align: right;
      white-space: nowrap;
    }

    .item-desc {
      font-size: 13.5px;
      font-weight: 300;
      color: #bbb;
      line-height: 1.45;
      letter-spacing: 0.01em;
    }

    .opt-label {
      font-size: 12px;
      font-weight: 400;
      color: #aaa;
      margin-right: 4px;
    }

    .diet-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 8px;
      transform: translateY(-1px);
    }
    .diet-dot.veg { background: #4caf50; box-shadow: 0 0 0 1px #fff, 0 0 4px #000; }
    .diet-dot.nonveg { background: #f44336; box-shadow: 0 0 0 1px #fff, 0 0 4px #000; }

    /* ── Loading screen ── */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease-out;
    }
    #loader.done {
      opacity: 0;
      pointer-events: none;
    }
    #loader-logo {
      width: 120px;
      height: auto;
      margin-bottom: 24px;
      opacity: 0.6;
    }
    #loader-bar-bg {
      width: 160px;
      height: 3px;
      background: #222;
      border-radius: 2px;
      overflow: hidden;
    }
    #loader-bar {
      height: 100%;
      width: 0%;
      background: #c17b55;
      border-radius: 2px;
      transition: width 0.15s ease-out;
    }
    #loader-text {
      font-size: 11px;
      color: #555;
      margin-top: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    /* ── Phase 4 UI: Navigation, Drawers, Buttons ── */
    #top-nav {
      position: fixed;
      top: 0; left: 0; width: 100%;
      height: 80px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      z-index: 50;
      /* Subtle dark gradient to ensure text/logo visibility at the very top */
      background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 100%);
      pointer-events: none;
    }
    #top-nav > * { pointer-events: auto; }

    #nav-hamburger-btn {
      background: none; border: none; color: #fff; cursor: pointer; padding: 8px;
    }

    .logo-container {
      display: flex; justify-content: center; align-items: center;
    }
    #top-logo {
      height: 28px;
      border-radius: 2px;
      /* The logo has a white background. Mix-blend-mode screen + invert makes it transparent with copper turning light blue.
         Instead, let's keep it as is, or apply a subtle sepia filter to blend it. */
      mix-blend-mode: screen;
      filter: invert(1) brightness(1.2) sepia(0.5) hue-rotate(-30deg); /* Approximate copper on transparent */
    }

    #nav-list-btn {
      background: none; border: none;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      padding: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    #list-count.has-items {
      color: #c17b55;
      font-weight: 600;
      display: inline-block;
    }

    /* Add to List Button */
    .price-action-wrapper {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .add-btn {
      background: none;
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      width: 28px; height: 28px;
      border-radius: 50%;
      display: flex; justify-content: center; align-items: center;
      cursor: pointer;
      font-size: 16px;
      font-weight: 300;
      transition: all 0.2s ease;
    }
    .add-btn:hover {
      background: rgba(255,255,255,0.1);
      border-color: #fff;
    }
    .add-btn.added {
      background: #c17b55;
      border-color: #c17b55;
      color: #fff;
    }

    /* Drawers */
    #drawer-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      z-index: 60;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    #drawer-overlay.open {
      opacity: 1; pointer-events: auto;
    }

    .drawer {
      position: fixed; top: 0; bottom: 0;
      width: 85%; max-width: 400px;
      background: #111;
      z-index: 70;
      display: flex; flex-direction: column;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .left-drawer { left: 0; transform: translateX(-100%); }
    .right-drawer { right: 0; transform: translateX(100%); }
    .drawer.open { transform: translateX(0); }

    .drawer-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 24px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .drawer-title {
      font-family: 'Playfair Display', serif;
      font-size: 24px; font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.1em;
      color: #c17b55;
    }
    .close-drawer-btn {
      background: none; border: none; color: #fff; font-size: 20px; cursor: pointer;
    }

    .drawer-content {
      flex: 1; overflow-y: auto; padding: 24px;
    }

    /* Nav Links */
    .nav-link {
      display: block; width: 100%; text-align: left;
      background: none; border: none; color: #fff;
      padding: 16px 0; cursor: pointer;
      font-family: 'Inter', sans-serif; font-size: 16px;
      text-transform: uppercase; letter-spacing: 0.05em;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .nav-link.group-link {
      font-family: 'Playfair Display', serif;
      font-size: 20px; color: #c17b55; margin-top: 16px;
    }

    /* List Items */
    .empty-list {
      color: #888; font-style: italic; text-align: center; margin-top: 40px;
    }
    .list-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .list-item-info { display: flex; flex-direction: column; gap: 4px; }
    .list-item-name { font-size: 15px; font-weight: 400; }
    .list-item-price { font-size: 14px; color: #c17b55; }
    .remove-btn {
      background: none; border: none; color: #888; font-size: 16px; cursor: pointer; padding: 8px;
    }

    .drawer-footer {
      padding: 24px; border-top: 1px solid rgba(255,255,255,0.1);
      background: #0a0a0a;
    }
    .total-row {
      display: flex; justify-content: space-between; align-items: center;
      font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 500;
      margin-bottom: 12px; color: #fff;
    }
    .footer-note {
      font-size: 12px; color: #888; text-align: center;
    }
  </style>
</head>
<body>

  <!-- Loading screen (progress-based, not a fake timer) -->
  <div id="loader">
    <img id="loader-logo" src="/assets/logo.jpg" alt="The Nines" />
    <div id="loader-bar-bg"><div id="loader-bar"></div></div>
    <div id="loader-text">Loading…</div>
  </div>

  <!-- Sticky canvas (video frame display) -->
  <div id="canvas-viewport">
    <canvas id="main-canvas"></canvas>
  </div>

  <!-- Top Navigation Bar -->
  <header id="top-nav">
    <button id="nav-hamburger-btn" aria-label="Menu">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
    
    <div class="logo-container">
      <img src="/assets/logo.jpg" alt="The Nines" id="top-logo" />
    </div>

    <button id="nav-list-btn" aria-label="My List">
      My List (<span id="list-count">0</span>)
    </button>
  </header>

  <!-- Navigation Drawer (Hamburger) -->
  <div id="nav-drawer" class="drawer left-drawer">
    <div class="drawer-header">
      <h3 class="drawer-title">Menu</h3>
      <button id="close-nav-btn" class="close-drawer-btn">✕</button>
    </div>
    <div id="nav-links" class="drawer-content"></div>
  </div>

  <!-- My List Drawer -->
  <div id="list-drawer" class="drawer right-drawer">
    <div class="drawer-header">
      <h3 class="drawer-title">My List</h3>
      <button id="close-list-btn" class="close-drawer-btn">✕</button>
    </div>
    <div id="list-items-container" class="drawer-content">
      <p class="empty-list">Your list is empty.</p>
    </div>
    <div class="drawer-footer">
      <div class="total-row">
        <span>Estimated Total</span>
        <span id="list-total-sum">₹0</span>
      </div>
      <p class="footer-note">Show this to your server to place an order.</p>
    </div>
  </div>

  <!-- Drawer Overlay (shared) -->
  <div id="drawer-overlay"></div>

  <!-- Menu Overlay -->
  <div id="menu-layer"></div>

  <!-- Scroll container (makes the page tall enough for all sections) -->
  <div id="scroll-container"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
