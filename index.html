<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>The Nines</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      /* Use dvh so iOS/Android address bar changes don't cause layout shift */
      height: 100%;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
      background: #0a0a0a;
    }

    body {
      background: #0a0a0a;
      color: #fff;
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100dvh;
      overflow-x: hidden;
      /* Allow native scroll — no hijacking */
    }

    /* ── Fixed canvas viewport ── */
    #canvas-viewport {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh; /* fallback */
      height: 100dvh;
      z-index: 0;
      overflow: hidden;
    }

    #main-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ── Scroll container (drives all animations) ── */
    #scroll-container {
      position: relative;
      z-index: 1;
      pointer-events: none;
      /* Height set by JS. Canvas is fixed, so no margin overlap needed. */
    }

    /* ── Desktop: centered vertical frame with dark side bars ── */
    @media (min-aspect-ratio: 9/16) {
      #canvas-viewport {
        left: 50%;
        transform: translateX(-50%);
        width: calc(100vh * 9 / 16);
        width: calc(100dvh * 9 / 16);
      }
    }

    /* ── Menu Overlay ── */
    #menu-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      z-index: 10;
      pointer-events: none;
    }
    
    .menu-section {
      position: absolute;
      top: 15vh; /* Menu starts scrolling from here */
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 414px; /* Mobile safe width */
      padding: 0 24px 10vh;
      pointer-events: auto; /* Let clicks pass to items if needed */
      text-shadow: 0 2px 16px rgba(0,0,0,0.4), 0 1px 3px rgba(0,0,0,0.8);
      will-change: transform, opacity;
    }

    .menu-section.group-intro {
      top: 50%;
      padding: 0 24px;
      /* center group intros precisely, they don't scroll */
      transform: translate(-50%, calc(-50% + var(--intro-y, 0px)));
    }

    /* Emergence animation logic */
    .group-title, .sec-header {
      opacity: var(--cat-prog, 1);
      transform: translateY(calc((1 - var(--cat-prog, 1)) * 30px));
    }
    .menu-content {
      opacity: var(--menu-prog, 1);
      transform: translateY(calc((1 - var(--menu-prog, 1)) * 40px));
    }

    /* Typography */
    .group-title {
      font-family: 'Playfair Display', serif;
      font-size: 44px;
      font-weight: 600;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .section-note {
      font-size: 13px;
      font-weight: 400;
      color: #ddd;
      margin-bottom: 24px;
      font-style: italic;
    }

    .subgroup {
      margin-top: 32px;
    }
    .subgroup-title {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 600;
      color: #c17b55;
      margin-bottom: 4px;
    }
    .subgroup-note {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 16px;
    }

    .items-grid {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .menu-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
    }

    .item-name {
      flex: 1;
      font-size: 16px;
      font-weight: 500;
      line-height: 1.3;
    }

    .item-price {
      font-size: 15px;
      font-weight: 600;
      color: #c17b55;
      text-align: right;
      white-space: nowrap;
    }

    .item-desc {
      font-size: 13px;
      font-weight: 400;
      color: #ccc;
      line-height: 1.4;
    }

    .opt-label {
      font-size: 12px;
      font-weight: 400;
      color: #aaa;
      margin-right: 4px;
    }

    .diet-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 8px;
      transform: translateY(-1px);
    }
    .diet-dot.veg { background: #4caf50; box-shadow: 0 0 0 1px #fff, 0 0 4px #000; }
    .diet-dot.nonveg { background: #f44336; box-shadow: 0 0 0 1px #fff, 0 0 4px #000; }

    /* ── Loading screen ── */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease-out;
    }
    #loader.done {
      opacity: 0;
      pointer-events: none;
    }
    #loader-logo {
      width: 120px;
      height: auto;
      margin-bottom: 24px;
      opacity: 0.6;
    }
    #loader-bar-bg {
      width: 160px;
      height: 3px;
      background: #222;
      border-radius: 2px;
      overflow: hidden;
    }
    #loader-bar {
      height: 100%;
      width: 0%;
      background: #c17b55;
      border-radius: 2px;
      transition: width 0.15s ease-out;
    }
    #loader-text {
      font-size: 11px;
      color: #555;
      margin-top: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <!-- Loading screen (progress-based, not a fake timer) -->
  <div id="loader">
    <img id="loader-logo" src="/assets/logo.jpg" alt="The Nines" />
    <div id="loader-bar-bg"><div id="loader-bar"></div></div>
    <div id="loader-text">Loading…</div>
  </div>

  <!-- Sticky canvas (video frame display) -->
  <div id="canvas-viewport">
    <canvas id="main-canvas"></canvas>
  </div>

  <!-- Menu Overlay -->
  <div id="menu-layer"></div>

  <!-- Scroll container (makes the page tall enough for all sections) -->
  <div id="scroll-container"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
