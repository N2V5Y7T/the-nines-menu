<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>The Nines</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      /* Use dvh so iOS/Android address bar changes don't cause layout shift */
      height: 100%;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
      background: #0a0a0a;
    }

    body {
      background: #0a0a0a;
      color: #fff;
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100dvh;
      overflow-x: hidden;
      /* Allow native scroll — no hijacking */
    }

    /* ── Sticky canvas viewport ── */
    #canvas-viewport {
      position: sticky;
      top: 0;
      width: 100%;
      height: 100dvh;
      z-index: 0;
      overflow: hidden;
      /* Centered for desktop — max 9:16 ratio */
    }

    #main-canvas {
      display: block;
      width: 100%;
      height: 100%;
      /* On desktop, center the 9:16 frame */
    }

    /* ── Scroll container (drives all animations) ── */
    #scroll-container {
      position: relative;
      z-index: 1;
      /* Height set by JS based on total scroll layout */
      /* This element is invisible — it just makes the page scrollable */
      pointer-events: none;
      margin-top: -100dvh; /* Overlap with sticky canvas */
    }

    /* ── Desktop: centered vertical frame with dark side bars ── */
    @media (min-aspect-ratio: 9/16) {
      #canvas-viewport {
        max-width: calc(100dvh * 9 / 16);
        margin: 0 auto;
      }
      body {
        background: #0a0a0a;
      }
    }

    /* ── Loading screen ── */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease-out;
    }
    #loader.done {
      opacity: 0;
      pointer-events: none;
    }
    #loader-logo {
      width: 120px;
      height: auto;
      margin-bottom: 24px;
      opacity: 0.6;
    }
    #loader-bar-bg {
      width: 160px;
      height: 3px;
      background: #222;
      border-radius: 2px;
      overflow: hidden;
    }
    #loader-bar {
      height: 100%;
      width: 0%;
      background: #c17b55;
      border-radius: 2px;
      transition: width 0.15s ease-out;
    }
    #loader-text {
      font-size: 11px;
      color: #555;
      margin-top: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <!-- Loading screen (progress-based, not a fake timer) -->
  <div id="loader">
    <img id="loader-logo" src="/assets/logo.jpg" alt="The Nines" />
    <div id="loader-bar-bg"><div id="loader-bar"></div></div>
    <div id="loader-text">Loading…</div>
  </div>

  <!-- Sticky canvas (video frame display) -->
  <div id="canvas-viewport">
    <canvas id="main-canvas"></canvas>
  </div>

  <!-- Scroll container (makes the page tall enough for all sections) -->
  <div id="scroll-container"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
