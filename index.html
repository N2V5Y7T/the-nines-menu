<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>The Nines</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      background: #0a0a0a;
      -webkit-text-size-adjust: 100%;
    }

    body {
      background: #0a0a0a;
      color: #fff;
      font-family: 'Inter', system-ui, sans-serif;
      margin: 0;
      /* Remove overflow-x: hidden and min-height constraints to ensure vertical scroll works */
    }

    /* ── Fixed canvas viewport ── */
    #canvas-viewport {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100dvh; /* fallback */
      height: 100dvh;
      z-index: 0;
      overflow: hidden;
      
      /* Cinematic initial load state */
      opacity: 0;
      filter: blur(20px);
      transform: scale(1.05);
      transition: opacity 1.5s cubic-bezier(0.16, 1, 0.3, 1), 
                  filter 1.5s cubic-bezier(0.16, 1, 0.3, 1), 
                  transform 1.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Cinematic dynamic darkening behind menu text */
    #video-scrim {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0, 0.5); /* 50% max darkness to make white text pop safely */
      opacity: 0; /* Opacity driven strictly by JS menuProgress */
      pointer-events: none;
      z-index: 5; /* Above canvas, below menu layer */
      will-change: opacity;
    }

    body.ready #canvas-viewport {
      opacity: 1;
      filter: blur(0);
      transform: scale(1);
    }

    #main-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ── Scroll container (drives all animations) ── */
    #scroll-container {
      position: relative;
      z-index: 1;
      pointer-events: none;
      /* Height set by JS. Canvas is fixed, so no margin overlap needed. */
    }

    /* ── Menu Overlay ── */
    #menu-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100dvh;
      height: 100dvh;
      z-index: 10;
      pointer-events: none;
      color: #fff;
      opacity: 0;
      transition: opacity 1.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    body.ready #menu-layer {
      opacity: 1;
    }
    
    .menu-section {
      position: absolute;
      top: 12vh; /* Tightened from 15vh (A6) */
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 414px; /* Mobile safe width */
      padding: 0 24px 10vh;
      pointer-events: auto; /* Let clicks pass to items if needed */
      text-shadow: 0 1px 4px rgba(0,0,0,0.9), 0 3px 20px rgba(0,0,0,0.5);
      will-change: transform, opacity;
      transition: text-shadow 0.4s ease, color 0.4s ease;
    }

    .menu-section.group-intro {
      top: 50%;
      padding: 0 24px;
      /* center group intros precisely, they don't scroll */
      transform: translate(-50%, calc(-50% + var(--intro-y, 0px)));
    }

        /* Emergence animation logic */
    .group-title, .sec-header {
      opacity: var(--cat-prog, 1);
      transform: translateY(calc((1 - var(--cat-prog, 1)) * 12vh));
      text-align: center;
      margin-bottom: 24px;
      transition: color 0.4s ease;
    }
    .menu-content {
      opacity: var(--menu-prog, 1);
      transform: translateY(calc((1 - var(--menu-prog, 1)) * 8vh));
      transition: color 0.4s ease;
    }

    /* Typography */
    .group-title {
      font-family: 'Playfair Display', serif;
      font-size: 48px;
      font-weight: 400; /* Lighter is more premium */
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #fff;
    }

    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #fff;
      margin-bottom: 4px;
    }

    .section-note {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 300;
      color: #bbb;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-style: normal;
    }

    .subgroup {
      margin-top: 36px;
    }
    .subgroup-title {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 400;
      color: #c17b55;
      margin-bottom: 8px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .subgroup-note {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 300;
      color: #bbb;
      margin-bottom: 18px;
    }

    .items-grid {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .menu-item {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    /* Single item: name + desc stacked, price + button on the right */
    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .item-name-wrap {
      flex: 1;
      min-width: 0; /* allow text to wrap */
    }

    .item-name {
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 400;
      line-height: 1.4;
      letter-spacing: 0.01em;
      margin: 0;
      color: #fff;
      transition: color 0.4s ease;
    }

    /* Single flat price */
    .price-flat {
      font-size: 15px;
      font-weight: 500;
      color: #c17b55;
      white-space: nowrap;
    }

    /* Multi-option items: name on top, chips + button on a second row */
    .menu-item.has-options .item-top-row {
      margin-bottom: 4px;
    }
    .item-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 8px;
    }

    /* Chips */
    .price-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .price-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 3px 10px;
      transition: background 0.4s ease, border-color 0.4s ease;
    }
    .chip-label {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 400;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      transition: color 0.4s ease;
    }
    .chip-price {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: #c17b55;
    }

    .item-price {
      /* wrapper, children are .price-flat or .price-chips */
    }

    .item-desc {
      font-size: 12.5px;
      font-weight: 300;
      color: #bbb;
      line-height: 1.45;
      letter-spacing: 0.01em;
      margin-top: 3px;
      transition: color 0.4s ease;
    }

    .diet-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      margin-right: 7px;
      transform: translateY(-1px);
      flex-shrink: 0;
    }
    .diet-dot.veg    { background: #4caf50; box-shadow: 0 0 0 1px rgba(255,255,255,0.4); }
    .diet-dot.nonveg { background: #f44336; box-shadow: 0 0 0 1px rgba(255,255,255,0.4); }


    /* ── Phase 4 UI: Navigation, Drawers, Buttons ── */
    #top-nav {
      position: fixed;
      top: 0; left: 0; width: 100%;
      height: 80px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 16px;
      padding-top: max(0px, env(safe-area-inset-top));
      padding-left: max(16px, env(safe-area-inset-left));
      padding-right: max(16px, env(safe-area-inset-right));
      z-index: 50;
      background: linear-gradient(to bottom, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0) 100%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    body.ready #top-nav {
      opacity: 1;
    }
    #top-nav > * { pointer-events: auto; }

    #nav-hamburger-btn {
      background: none; border: none; color: #fff; cursor: pointer; padding: 8px;
      justify-self: start;
    }

    .logo-container {
      display: flex; justify-content: center; align-items: center;
    }
    #top-logo {
      height: 52px;   /* taller so the full crest logo is visible */
      width: auto;
      /* White background on the new logo — mix-blend-mode multiply makes white transparent */
      mix-blend-mode: multiply;
      filter: invert(1) brightness(1.6) sepia(0.4) hue-rotate(-20deg);
    }

    #nav-list-btn {
      background: none; border: none;
      color: #fff;
      cursor: pointer;
      padding: 8px;
      justify-self: end;
      position: relative;   /* for badge positioning */
      display: flex; align-items: center;
    }
    /* Cart icon badge */
    #list-count {
      position: absolute;
      top: 2px; right: 2px;
      background: #c17b55;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 600;
      min-width: 16px; height: 16px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      padding: 0 3px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    #list-count.has-items {
      opacity: 1;
    }

    /* Add to List Button */
    .price-action-wrapper {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .add-btn {
      background: none;
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      width: 28px; height: 28px;
      border-radius: 50%;
      display: flex; justify-content: center; align-items: center;
      cursor: pointer;
      font-size: 16px;
      font-weight: 300;
      transition: background 0.4s ease, border-color 0.4s ease, color 0.4s ease, transform 0.2s ease;
    }
    .add-btn:hover {
      background: rgba(255,255,255,0.1);
      border-color: #fff;
    }
    .add-btn.added {
      background: #c17b55;
      border-color: #c17b55;
      color: #fff;
    }

    /* Drawers */
    #drawer-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      z-index: 60;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    #drawer-overlay.open {
      opacity: 1; pointer-events: auto;
    }

    .drawer {
      position: fixed; top: 0; bottom: 0;
      width: 85%; max-width: 400px;
      background: #111;
      z-index: 70;
      display: flex; flex-direction: column;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .left-drawer { left: 0; transform: translateX(-100%); }
    .right-drawer { right: 0; transform: translateX(100%); }
    .drawer.open { transform: translateX(0); }

    .drawer-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 24px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .drawer-title {
      font-family: 'Playfair Display', serif;
      font-size: 24px; font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.1em;
      color: #c17b55;
    }
    .close-drawer-btn {
      background: none; border: none; color: #fff; font-size: 20px; cursor: pointer;
    }

    .drawer-content {
      flex: 1; overflow-y: auto; padding: 24px;
    }

    /* Nav Links */
    .nav-group-header {
      font-family: 'Playfair Display', serif;
      font-size: 24px; color: #c17b55; margin-top: 24px; padding-bottom: 8px;
      text-transform: uppercase; letter-spacing: 0.1em;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .nav-link {
      display: block; width: 100%; text-align: left;
      background: none; border: none; color: #fff;
      padding: 16px 0; cursor: pointer;
      font-family: 'Inter', sans-serif; font-size: 15px;
      text-transform: uppercase; letter-spacing: 0.05em;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      transition: color 0.2s ease;
    }
    .nav-link:hover {
      color: #c17b55;
    }
    .nav-link.group-link {
      font-family: 'Playfair Display', serif;
      font-size: 24px; color: #c17b55; margin-top: 16px;
      letter-spacing: 0.1em;
    }
    .nav-link.section-link {
      padding-left: 16px;
      font-size: 14px;
      color: #bbb;
    }

    /* List Items */
    .empty-list {
      color: #888; font-style: italic; text-align: center; margin-top: 40px;
    }
    .list-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .list-item-info { display: flex; flex-direction: column; gap: 4px; }
    .list-item-name { font-size: 15px; font-weight: 400; }
    .list-item-price { font-size: 14px; color: #c17b55; }
    .remove-btn {
      background: none; border: none; color: #888; font-size: 16px; cursor: pointer; padding: 8px;
    }

    .drawer-footer {
      padding: 24px; border-top: 1px solid rgba(255,255,255,0.1);
      background: #0a0a0a;
    }
    .total-row {
      display: flex; justify-content: space-between; align-items: center;
      font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 500;
      margin-bottom: 12px; color: #fff;
    }
    .footer-note {
      font-size: 12px; color: #888; text-align: center;
    }

    /* ─────────────────────────────────────────────────────────────
       Phase 6 — Responsive, Desktop & Motion Polish
    ───────────────────────────────────────────────────────────── */

    /* ── Safe-area insets (iOS notch / Dynamic Island) ── */
    #top-nav {
      padding-top: max(0px, env(safe-area-inset-top));
      padding-left: max(24px, env(safe-area-inset-left));
      padding-right: max(24px, env(safe-area-inset-right));
    }
    .drawer {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .drawer-footer {
      padding-bottom: max(24px, env(safe-area-inset-bottom));
    }

    /* ── Desktop / wide viewport: center the 9:16 frame ── */
    /* Any viewport wider than a 9:16 portrait phone */
    @media (min-aspect-ratio: 9/16) {
      /* Canvas + nav constrained to 9:16 column */
      #canvas-viewport,
      #top-nav {
        left: 50% !important;
        transform: translateX(-50%) !important;
        width: calc(100dvh * 9 / 16) !important;
        width: calc(100dvh * 9 / 16) !important;
      }

      /* Menu layer also constrains to the video column */
      #menu-layer {
        left: 50%;
        transform: translateX(-50%);
        width: calc(100dvh * 9 / 16);
        width: calc(100dvh * 9 / 16);
      }

      /* Dark side bars with blurred first-frame background (see JS for dynamic bg-image) */
      body::before,
      body::after {
        content: '';
        position: fixed;
        top: 0; bottom: 0;
        width: calc((100vw - (100dvh * 9 / 16)) / 2);
        width: calc((100vw - (100dvh * 9 / 16)) / 2);
        background: #0a0a0a;
        z-index: -1;
      }
      body::before { left: 0; }
      body::after  { right: 0; }
    }

    /* ── Landscape phone: allow wider content column ── */
    /* e.g. iPhone in landscape — viewport is ~16:9, but still a phone */
    @media (orientation: landscape) and (max-height: 500px) {
      /* Relax the 9:16 cap — use the full width so the video fills properly */
      #canvas-viewport,
      #top-nav,
      #menu-layer {
        left: 0 !important;
        transform: none !important;
        width: 100% !important;
      }
      body::before, body::after { display: none; }

      /* Tighten top nav height so it doesn't eat too much landscape space */
      #top-nav {
        height: 52px;
      }

      /* Smaller text on landscape phone */
      .group-title  { font-size: 32px; }
      .section-title { font-size: 22px; }
      .item-name    { font-size: 14px; }
      .item-price   { font-size: 13px; }
    }

    /* ── Minimum touch-target size: 44×44px (WCAG 2.5.5) ── */
    #nav-hamburger-btn,
    #nav-list-btn,
    .add-btn,
    .remove-btn,
    .close-drawer-btn,
    .nav-link {
      min-height: 44px;
      min-width: 44px;
    }
    /* add-btn is circular — override to keep it round but still 44×44 tap area */
    .add-btn {
      width: 28px;
      height: 28px;
      position: relative;
    }
    .add-btn::after {
      content: '';
      position: absolute;
      inset: -8px; /* expands tap area to 44px without changing visual size */
    }

    /* ── prefers-reduced-motion ── */
    @media (prefers-reduced-motion: reduce) {
      /* Disable smooth scroll on nav jumps */
      html { scroll-behavior: auto !important; }

      /* Skip entrance / exit transforms — just fade */
      .group-title, .sec-header {
        transform: none !important;
        transition: opacity 0.15s ease;
      }
      .menu-viewport {
      position: relative;
      mask-image: linear-gradient(to bottom, transparent 0%, transparent 12px, black 48px, black 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, transparent 12px, black 48px, black 100%);
    }
    .menu-content {
        padding-top: 48px;
        transform: none !important;
        transition: opacity 0.15s ease;
      }

      /* No transform on drawers — just appear */
      .drawer {
        transition: opacity 0.2s ease !important;
        transform: none !important;
      }
      .left-drawer  { opacity: 0; pointer-events: none; }
      .right-drawer { opacity: 0; pointer-events: none; }
      .drawer.open  { opacity: 1; pointer-events: auto; }

      /* Disable the add-btn pop animation */
      .add-btn { transition: background 0.1s, border-color 0.1s; }
    }
    /* ── Option Picker Bottom Sheet ── */
    #option-picker-bg {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 200;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    #option-picker-bg.open { opacity: 1; }

    #option-picker {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      /* On desktop: constrain to the video column */
      max-width: 414px;
      margin: 0 auto;
      background: #111;
      border-radius: 20px 20px 0 0;
      padding: 12px 0 max(24px, env(safe-area-inset-bottom));
      z-index: 201;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #option-picker.open { transform: translateY(0); }

    .picker-handle {
      width: 40px; height: 4px;
      background: rgba(255,255,255,0.2);
      border-radius: 2px;
      margin: 0 auto 20px;
    }

    .picker-title {
      font-family: 'Playfair Display', serif;
      font-size: 20px; font-weight: 400;
      text-align: center;
      padding: 0 24px 8px;
      color: #fff;
    }
    .picker-desc {
      font-family: 'Inter', sans-serif;
      font-size: 13px; color: #999;
      text-align: center;
      padding: 0 24px 16px;
      line-height: 1.5;
    }

    .picker-options {
      display: flex; flex-direction: column;
      gap: 1px;
      border-top: 1px solid rgba(255,255,255,0.07);
    }

    .picker-option-btn {
      display: flex; justify-content: space-between; align-items: center;
      width: 100%;
      background: none; border: none;
      padding: 18px 24px;
      cursor: pointer;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      transition: background 0.15s;
      /* Large touch target */
      min-height: 56px;
    }
    .picker-option-btn:active,
    .picker-option-btn:focus-visible {
      background: rgba(255,255,255,0.06);
    }
    .picker-option-btn.selected {
      background: rgba(193,123,85,0.15);
    }
    .picker-option-label {
      font-weight: 400;
      letter-spacing: 0.02em;
    }
    .picker-option-price {
      color: #c17b55;
      font-weight: 500;
      font-size: 15px;
    }
        /* Stepper styling inside add-btn */
      .add-btn.added {
        width: 80px; /* Expand to fit minus, number, plus */
        padding: 0 4px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(255, 255, 255, 0.2);
      }
      .qty-btn {
        width: 24px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-weight: 500;
      }
      .qty-val {
        font-size: 14px;
        font-weight: 500;
        pointer-events: none;
      }
      .variant-qty-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 16px; height: 16px;
        background: #fff; color: #000;
        border-radius: 50%;
        font-size: 10px; font-weight: bold;
        margin-left: 6px;
      }
      .drawer-qty-stepper {
        display: flex; align-items: center; gap: 8px;
        background: #222;
        border-radius: 12px;
        padding: 2px 6px;
      }
      .drawer-qty-btn {
        background: none; border: none;
        color: #fff; font-size: 14px;
        width: 20px; height: 20px;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer;
      }
      .drawer-qty-val {
        font-family: 'Inter', sans-serif;
        font-size: 13px; font-weight: 500;
        min-width: 14px; text-align: center;
      }
</style>
</head>
<body>



  <!-- Sticky canvas (video frame display) -->
  <div id="canvas-viewport">
    <canvas id="main-canvas"></canvas>
    <div id="video-scrim"></div>
  </div>

  <!-- Top Navigation Bar -->
  <header id="top-nav">
    <button id="nav-hamburger-btn" aria-label="Menu">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
    
    <div class="logo-container">
      <img src="./assets/logo-new.png" alt="The Nines" id="top-logo" />
    </div>

    <button id="nav-list-btn" aria-label="My List">
      <!-- Cart / bag icon -->
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="21" r="1"></circle>
        <circle cx="20" cy="21" r="1"></circle>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
      </svg>
      <span id="list-count">0</span>
    </button>
  </header>

  <!-- Navigation Drawer (Hamburger) -->
  <div id="nav-drawer" class="drawer left-drawer">
    <div class="drawer-header">
      <h3 class="drawer-title">Menu</h3>
      <button id="close-nav-btn" class="close-drawer-btn">✕</button>
    </div>
    <div id="nav-links" class="drawer-content"></div>
  </div>

  <!-- My List Drawer -->
  <div id="list-drawer" class="drawer right-drawer">
    <div class="drawer-header">
      <h3 class="drawer-title">My List</h3>
      <button id="close-list-btn" class="close-drawer-btn">✕</button>
    </div>
    <div id="list-items-container" class="drawer-content">
      <p class="empty-list">Your list is empty.</p>
    </div>
    <div class="drawer-footer">
      <div class="total-row">
        <span>Estimated Total</span>
        <span id="list-total-sum">₹0</span>
      </div>
      <p class="footer-note">Show this to your server to place an order.</p>
    </div>
  </div>

  <!-- Drawer Overlay (shared) -->
  <div id="drawer-overlay"></div>

  <!-- Menu Overlay -->
  <div id="menu-layer"></div>

  <!-- Scroll container (makes the page tall enough for all sections) -->
  <div id="scroll-container"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
