<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>The Nines</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      background: #0a0a0a;
      -webkit-text-size-adjust: 100%;
    }

    body {
      background: #0a0a0a;
      color: #fff;
      font-family: 'Inter', system-ui, sans-serif;
      margin: 0;
      /* Remove overflow-x: hidden and min-height constraints to ensure vertical scroll works */
    }

    /* ── Fixed canvas viewport ── */
    #canvas-viewport {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100dvh; /* fallback */
      height: 100dvh;
      z-index: 0;
      overflow: hidden;
      
      /* Cinematic initial load state */
      opacity: 0;
      filter: blur(20px);
      transform: scale(1.05);
      transition: opacity 1.5s cubic-bezier(0.16, 1, 0.3, 1), 
                  filter 1.5s cubic-bezier(0.16, 1, 0.3, 1), 
                  transform 1.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Cinematic dynamic darkening behind menu text */
    #video-scrim {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0, 0.5); /* 50% max darkness to make white text pop safely */
      opacity: 0; /* Opacity driven strictly by JS menuProgress */
      pointer-events: none;
      z-index: 5; /* Above canvas, below menu layer */
      will-change: opacity;
    }

    body.ready #canvas-viewport {
      opacity: 1;
      filter: blur(0);
      transform: scale(1);
    }

    #main-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ── Scroll container (drives all animations) ── */
    #scroll-container {
      position: relative;
      z-index: 1;
      pointer-events: none;
      /* Height set by JS. Canvas is fixed, so no margin overlap needed. */
    }

    /* ── Menu Overlay ── */
    #menu-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100dvh;
      height: 100dvh;
      z-index: 10;
      pointer-events: none;
      color: #fff;
      opacity: 0;
      transition: opacity 1.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    body.ready #menu-layer {
      opacity: 1;
    }
    
    .menu-section {
      position: absolute;
      top: 12vh; /* Tightened from 15vh (A6) */
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 414px; /* Mobile safe width */
      padding: 0 24px 10vh;
      pointer-events: auto; /* Let clicks pass to items if needed */
      text-shadow: 0 1px 4px rgba(0,0,0,0.9), 0 3px 20px rgba(0,0,0,0.5);
      will-change: transform, opacity;
      transition: text-shadow 0.4s ease, color 0.4s ease;
    }

    .menu-section.group-intro {
      top: 50%;
      padding: 0 24px;
      /* center group intros precisely, they don't scroll */
      transform: translate(-50%, calc(-50% + var(--intro-y, 0px)));
    }

        /* Emergence animation logic */
    .group-title, .sec-header {
      opacity: var(--cat-prog, 1);
      transform: translateY(calc((1 - var(--cat-prog, 1)) * 12vh));
      text-align: center;
      margin-bottom: 24px;
      transition: color 0.4s ease;
    }
    .menu-content {
      opacity: var(--menu-prog, 1);
      transform: translateY(calc((1 - var(--menu-prog, 1)) * 8vh));
      transition: color 0.4s ease;
    }
      .menu-viewport {
      position: relative;
      mask-image: linear-gradient(to bottom, transparent 0%, transparent 12px, black 48px, black 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, transparent 12px, black 48px, black 100%);
    }
    .menu-content {
        padding-top: 48px;
        transform: none !important;
        transition: opacity 0.15s ease;
      }

      /* No transform on drawers — just appear */
      .drawer {
        transition: opacity 0.2s ease !important;
        transform: none !important;
      }
      .left-drawer  { opacity: 0; pointer-events: none; }
      .right-drawer { opacity: 0; pointer-events: none; }
      .drawer.open  { opacity: 1; pointer-events: auto; }

      /* Disable the add-btn pop animation */
      .add-btn { transition: background 0.1s, border-color 0.1s; }
    }
    /* ── Option Picker Bottom Sheet ── */
    #option-picker-bg {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 200;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    #option-picker-bg.open { opacity: 1; }

    #option-picker {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      /* On desktop: constrain to the video column */
      max-width: 414px;
      margin: 0 auto;
      background: #111;
      border-radius: 20px 20px 0 0;
      padding: 12px 0 max(24px, env(safe-area-inset-bottom));
      z-index: 201;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #option-picker.open { transform: translateY(0); }

    .picker-handle {
      width: 40px; height: 4px;
      background: rgba(255,255,255,0.2);
      border-radius: 2px;
      margin: 0 auto 20px;
    }

    .picker-title {
      font-family: 'Playfair Display', serif;
      font-size: 20px; font-weight: 400;
      text-align: center;
      padding: 0 24px 8px;
      color: #fff;
    }
    .picker-desc {
      font-family: 'Inter', sans-serif;
      font-size: 13px; color: #999;
      text-align: center;
      padding: 0 24px 16px;
      line-height: 1.5;
    }

    .picker-options {
      display: flex; flex-direction: column;
      gap: 1px;
      border-top: 1px solid rgba(255,255,255,0.07);
    }

    .picker-option-btn {
      display: flex; justify-content: space-between; align-items: center;
      width: 100%;
      background: none; border: none;
      padding: 18px 24px;
      cursor: pointer;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      transition: background 0.15s;
      /* Large touch target */
      min-height: 56px;
    }
    .picker-option-btn:active,
    .picker-option-btn:focus-visible {
      background: rgba(255,255,255,0.06);
    }
    .picker-option-btn.selected {
      background: rgba(193,123,85,0.15);
    }
    .picker-option-label {
      font-weight: 400;
      letter-spacing: 0.02em;
    }
    .picker-option-price {
      color: #c17b55;
      font-weight: 500;
      font-size: 15px;
    }
        /* Stepper styling inside add-btn */
      .add-btn.added {
        width: 80px; /* Expand to fit minus, number, plus */
        padding: 0 4px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(255, 255, 255, 0.2);
      }
      .qty-btn {
        width: 24px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-weight: 500;
      }
      .qty-val {
        font-size: 14px;
        font-weight: 500;
        pointer-events: none;
      }
      .variant-qty-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 16px; height: 16px;
        background: #fff; color: #000;
        border-radius: 50%;
        font-size: 10px; font-weight: bold;
        margin-left: 6px;
      }
      .drawer-qty-stepper {
        display: flex; align-items: center; gap: 8px;
        background: #222;
        border-radius: 12px;
        padding: 2px 6px;
      }
      .drawer-qty-btn {
        background: none; border: none;
        color: #fff; font-size: 14px;
        width: 20px; height: 20px;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer;
      }
      .drawer-qty-val {
        font-family: 'Inter', sans-serif;
        font-size: 13px; font-weight: 500;
        min-width: 14px; text-align: center;
      }
</style>
</head>
<body>



  <!-- Sticky canvas (video frame display) -->
  <div id="canvas-viewport">
    <canvas id="main-canvas"></canvas>
    <div id="video-scrim"></div>
  </div>

  <!-- Top Navigation Bar -->
  <header id="top-nav">
    <button id="nav-hamburger-btn" aria-label="Menu">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
    
    <div class="logo-container">
      <img src="./assets/logo-new.png" alt="The Nines" id="top-logo" />
    </div>

    <button id="nav-list-btn" aria-label="My List">
      <!-- Cart / bag icon -->
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="21" r="1"></circle>
        <circle cx="20" cy="21" r="1"></circle>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
      </svg>
      <span id="list-count">0</span>
    </button>
  </header>

  <!-- Navigation Drawer (Hamburger) -->
  <div id="nav-drawer" class="drawer left-drawer">
    <div class="drawer-header">
      <h3 class="drawer-title">Menu</h3>
      <button id="close-nav-btn" class="close-drawer-btn">✕</button>
    </div>
    <div id="nav-links" class="drawer-content"></div>
  </div>

  <!-- My List Drawer -->
  <div id="list-drawer" class="drawer right-drawer">
    <div class="drawer-header">
      <h3 class="drawer-title">My List</h3>
      <button id="close-list-btn" class="close-drawer-btn">✕</button>
    </div>
    <div id="list-items-container" class="drawer-content">
      <p class="empty-list">Your list is empty.</p>
    </div>
    <div class="drawer-footer">
      <div class="total-row">
        <span>Estimated Total</span>
        <span id="list-total-sum">₹0</span>
      </div>
      <p class="footer-note">Show this to your server to place an order.</p>
    </div>
  </div>

  <!-- Drawer Overlay (shared) -->
  <div id="drawer-overlay"></div>

  <!-- Menu Overlay -->
  <div id="menu-layer"></div>

  <!-- Scroll container (makes the page tall enough for all sections) -->
  <div id="scroll-container"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
